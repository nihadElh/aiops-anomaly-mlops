[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-anomaly-mlops"
version = "0.1.0"
description = "Détection d'anomalies sur logs système (HDFS) : pipeline MLOps reproductible"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "mlflow>=2.14,<3",
  "sqlalchemy>=2.0,<2.1",   # MLflow 2.x est incompatible avec SQLAlchemy 2.1
  "joblib>=1.3",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "pip-audit>=2.7", "dvc>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
